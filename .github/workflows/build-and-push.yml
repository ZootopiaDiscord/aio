name: Build and Push Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: aio
            image: ${{ github.event.repository.name }}
            dockerfile: ZootopiaAio/Dockerfile.CI
            publish: |
              dotnet publish ZootopiaAio/ZootopiaAio.csproj -c Release -r linux-x64 -o publish/amd64 /p:UseAppHost=false
              dotnet publish ZootopiaAio/ZootopiaAio.csproj -c Release -r linux-arm64 -o publish/arm64 /p:UseAppHost=false
          - name: app
            image: ${{ github.event.repository.name }}/app
            dockerfile: ZootopiaAio.App/Dockerfile.CI
            publish: |
              dotnet publish ZootopiaAio.App/ZootopiaAio.App.csproj -c Release -p:PublishBlazorGateway=true -o publish/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.7.26381.103
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish
        run: ${{ matrix.publish }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short
          flavor: |
            latest=${{ github.ref_type == 'tag' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push when not a PR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    runs-on: ubuntu-26.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Compute release name (from tag)
        id: release_meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_meta.outputs.version }}
          draft: false
          prerelease: false
